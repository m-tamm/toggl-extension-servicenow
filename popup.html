<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toggl Import</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="container">
      <div class="top-bar">
        <div>
          <h1>Tracker Import</h1>
          <p id="active-tracker-indicator" class="active-tracker"></p>
        </div>
        <button id="open-settings" type="button" class="tiny secondary">Settings</button>
      </div>

      <section id="settings-section" class="card hidden">
        <h2>Tracker Settings</h2>
        <label for="tracker-select">Tracker Provider</label>
        <select id="tracker-select">
          <option value="toggl">Toggl</option>
          <option value="super-productivity">Super Productivity</option>
        </select>
        <div class="row">
          <button id="save-settings" type="button">Save Settings</button>
          <button id="close-settings" type="button" class="tiny secondary">Close</button>
        </div>
      </section>

      <section id="token-section" class="card">
        <h2 id="setup-title">Setup</h2>
        <label for="api-token" id="api-token-label">Toggl API Token</label>
        <input id="api-token" type="password" placeholder="Paste token" autocomplete="off" />
        <div class="row">
          <button id="save-token" type="button">Save Token</button>
          <button id="clear-token" type="button" class="danger">Clear Token</button>
        </div>
      </section>

      <section id="data-section" class="card hidden">
        <div class="section-head">
          <h2>Fetch Entries</h2>
          <button id="show-token-form" type="button" class="tiny secondary">Change Access</button>
        </div>
        <label for="target-date">Date</label>
        <input id="target-date" type="date" />
        <div class="row">
          <button id="fetch-entries" type="button">Fetch Entries</button>
          <button id="clear-cache" type="button">Clear Cached Day</button>
        </div>

        <p id="cache-info" class="muted"></p>

        <ul id="entries" class="entries"></ul>
      </section>

      <p id="status" class="status" aria-live="polite"></p>
    </main>

    <script src="popup.js" type="module"></script>
  </body>
</html>
